<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 230" width="170" height="230">
  <defs>
    <radialGradient id="farmerGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="axeIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="85" cy="215" rx="65" ry="13" fill="#0c0a09" opacity="0.65"/>
  <!-- Rage Aura -->
  <circle cx="85" cy="115" r="85" fill="url(#farmerGlow)"/>

  <!-- Left-Facing Silhouette: Enraged Farmer (Heavy Bruiser) -->
  <!-- Sturdy Legs -->
  <rect x="64" y="155" width="18" height="52" rx="4" fill="#1c1917"/>
  <rect x="94" y="155" width="18" height="52" rx="4" fill="#1c1917"/>
  <!-- Heavy Clogs / Work Boots -->
  <path d="M54 200 L84 200 L84 214 L48 214 Z" fill="#27272a"/>
  <path d="M86 200 L114 200 L114 214 L80 214 Z" fill="#27272a"/>

  <!-- Heavy Wool Shirt / Torso -->
  <path d="M50 82 L125 76 L135 160 L40 160 Z" fill="#3f3f46" stroke="#18181b" stroke-width="2"/>

  <!-- Heavy Leather Butcher/Field Apron -->
  <path d="M58 92 L116 88 L122 175 L52 175 Z" fill="url(#apronGrad)" stroke="#292524" stroke-width="2"/>
  <!-- Iron Buckles & Straps -->
  <rect x="68" y="90" width="8" height="12" fill="#71717a"/>
  <rect x="98" y="87" width="8" height="12" fill="#71717a"/>

  <!-- Broad Head with Coarse Cap (Facing Left) -->
  <path d="M60 40 C60 20 80 14 106 18 C128 22 134 40 130 62 C126 78 110 84 85 82 C68 80 58 60 60 40 Z" fill="#27272a" stroke="#09090b" stroke-width="2.5"/>
  <!-- Straw Hat / Brim -->
  <ellipse cx="88" cy="38" rx="42" ry="9" fill="#a16207" stroke="#713f12" stroke-width="2"/>

  <!-- Aggressive Face Shadow -->
  <path d="M62 38 C68 32 80 34 82 48 C82 60 72 65 65 62 Z" fill="#18181b"/>
  <!-- Angry Yellow/Orange Enraged Eyes -->
  <ellipse cx="70" cy="46" rx="3.5" ry="2.2" fill="#f97316"/>
  <circle cx="70" cy="46" r="1.2" fill="#fef08a"/>
  <!-- Gritting Teeth / Grimace -->
  <rect x="64" y="54" width="8" height="3" fill="#f8fafc" rx="1"/>

  <!-- Beefy Arms -->
  <path d="M110 90 L132 120 L108 140" fill="none" stroke="#52525b" stroke-width="14" stroke-linecap="round"/>
  <!-- Front Arm swinging heavy weapon -->
  <path d="M68 95 L40 115 L25 105" fill="none" stroke="#71717a" stroke-width="14" stroke-linecap="round"/>

  <!-- Heavy Woodcutter's Scythe / Battle Cleaver (Facing Left) -->
  <line x1="20" y1="15" x2="65" y2="215" stroke="#451a03" stroke-width="7" stroke-linecap="round"/>
  <!-- Massive Curved Iron Blade -->
  <path d="M8 22 C2 35 6 65 24 85 L28 40 Z" fill="url(#axeIron)" stroke="#0f172a" stroke-width="2"/>
  <path d="M6 26 Q-4 50 16 80" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
  <!-- Rust & Blood splatter -->
  <circle cx="16" cy="48" r="3" fill="#7f1d1d"/>
  <circle cx="12" cy="62" r="2.5" fill="#7f1d1d"/>
</svg>
