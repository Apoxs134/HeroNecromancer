<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <!-- Card Border Gradient -->
    <linearGradient id="metal_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Dark Fantasy Stone Background -->
    <radialGradient id="card_bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Art Frame Rim -->
    <linearGradient id="gold_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Description Plate -->
    <linearGradient id="desc_plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Outer Card Shell -->
  <rect x="2" y="2" width="236" height="336" rx="14" fill="url(#metal_border)" stroke="#475569" stroke-width="2" />
  <rect x="6" y="6" width="228" height="328" rx="12" fill="url(#card_bg)" />

  <!-- Corner Runes & Accents -->
  <circle cx="16" cy="16" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="224" cy="16" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="16" cy="324" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="224" cy="324" r="3" fill="#38bdf8" opacity="0.8" />

  <!-- Title Header Bar -->
  <rect x="18" y="16" width="204" height="28" rx="6" fill="#0f172a" stroke="url(#gold_rim)" stroke-width="1.5" />

  <!-- Art Display Area Frame -->
  <rect x="18" y="50" width="204" height="130" rx="8" fill="#020617" stroke="#334155" stroke-width="2" />

  <!-- Type & Rarity Ribbon Banner -->
  <polygon points="40,185 200,185 188,209 52,209" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

  <!-- Description Box -->
  <rect x="18" y="214" width="204" height="106" rx="8" fill="url(#desc_plate)" stroke="#334155" stroke-width="1.5" />

  <!-- Bottom Pale Sigil Inscription -->
  <line x1="40" y1="308" x2="200" y2="308" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <polygon points="120,304 125,308 120,312 115,308" fill="#38bdf8" opacity="0.7" />
</svg>
