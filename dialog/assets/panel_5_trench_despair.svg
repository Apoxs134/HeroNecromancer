<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="rain_sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="mud_ditch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Bleak Rainy Sky -->
  <rect width="1280" height="720" fill="url(#rain_sky)" />

  <!-- Rain Streaks -->
  <line x1="120" y1="40" x2="80" y2="180" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" />
  <line x1="340" y1="80" x2="300" y2="240" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" />
  <line x1="680" y1="30" x2="640" y2="190" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" />
  <line x1="920" y1="70" x2="880" y2="220" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" />
  <line x1="1140" y1="40" x2="1100" y2="200" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" />

  <!-- Trench Mud Ravine Slopes -->
  <polygon points="0,320 440,720 0,720" fill="url(#mud_ditch)" />
  <polygon points="1280,320 840,720 1280,720" fill="url(#mud_ditch)" />
  <rect x="360" y="520" width="560" height="200" fill="#0f172a" />

  <!-- Piles of Dead Soldiers & Broken Weapons -->
  <circle cx="280" cy="580" r="18" fill="#475569" opacity="0.7" /> <!-- Rotting skull -->
  <line x1="240" y1="620" x2="310" y2="520" stroke="#334155" stroke-width="5" /> <!-- Broken spear -->
  <line x1="980" y1="640" x2="940" y2="530" stroke="#334155" stroke-width="5" /> <!-- Broken spear -->

  <!-- Vargas's Cleaved Shield & Lifeless Body -->
  <rect x="420" y="540" width="70" height="110" rx="6" transform="rotate(35 420 540)" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <circle cx="490" cy="560" r="22" fill="#64748b" /> <!-- Vargas Head (Dead, eyes closed) -->
  <line x1="480" y1="560" x2="500" y2="560" stroke="#0f172a" stroke-width="3" /> <!-- Closed dead eye -->
  <polygon points="460,580 540,580 560,670 440,670" fill="#1e293b" />

  <!-- Dead Squadmates (Kaelen with arrow in throat, Lyra's rosary) -->
  <circle cx="780" cy="570" r="18" fill="#475569" /> <!-- Kaelen corpse -->
  <line x1="770" y1="585" x2="820" y2="560" stroke="#94a3b8" stroke-width="4" /> <!-- Spear through throat -->
  <circle cx="860" cy="620" r="16" fill="#334155" /> <!-- Lyra corpse -->

  <!-- The Hero on Knees (Grief & Weeping) -->
  <circle cx="630" cy="460" r="24" fill="#94a3b8" />
  <polygon points="590,490 670,490 680,620 580,620" fill="#1e293b" />
  <!-- Head bowed in weeping hands -->
  <line x1="610" y1="475" x2="625" y2="465" stroke="#cbd5e1" stroke-width="5" />
  <line x1="650" y1="475" x2="635" y2="465" stroke="#cbd5e1" stroke-width="5" />
  <!-- Grasping Vargas's cold arm -->
  <line x1="590" y1="520" x2="520" y2="560" stroke="#cbd5e1" stroke-width="5" />

</svg>
