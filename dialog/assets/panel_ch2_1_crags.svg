<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky_crags" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="35%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="obsidian_crag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="mist_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="pale_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky & Frozen Atmospheric Peaks -->
  <rect width="1280" height="720" fill="url(#sky_crags)" />

  <!-- Distant Jagged Mountain Silhouette -->
  <polygon points="0,520 180,310 260,370 420,240 580,390 760,190 920,340 1080,220 1280,480 1280,720 0,720" fill="#0f172a" opacity="0.8" />
  
  <!-- Midground Crags & Needles -->
  <polygon points="0,620 120,410 210,480 340,320 480,510 650,290 820,490 990,310 1150,470 1280,380 1280,720 0,720" fill="#070c18" />

  <!-- Frozen Scree and Mist Layer -->
  <rect x="0" y="420" width="1280" height="180" fill="url(#mist_gradient)" />

  <!-- Foreground Mountain Shelf (Left) -->
  <polygon points="0,720 0,480 190,460 360,540 450,720" fill="url(#obsidian_crag)" />
  
  <!-- Foreground Shelf (Right) -->
  <polygon points="820,720 920,530 1100,490 1280,510 1280,720" fill="url(#obsidian_crag)" />

  <!-- Hanging Iron Gibbet / Gallows Posts -->
  <g stroke="#030712" stroke-width="6" stroke-linecap="round">
    <!-- Post 1 (Left shelf) -->
    <line x1="140" y1="520" x2="140" y2="340" />
    <line x1="140" y1="340" x2="220" y2="340" stroke-width="5" />
    <line x1="140" y1="370" x2="170" y2="340" stroke-width="4" />
    <!-- Chain & Cage -->
    <line x1="210" y1="340" x2="210" y2="390" stroke="#1e293b" stroke-width="2" />
    <rect x="195" y="390" width="30" height="50" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
    <line x1="205" y1="390" x2="205" y2="440" stroke="#0f172a" stroke-width="2" />
    <line x1="215" y1="390" x2="215" y2="440" stroke="#0f172a" stroke-width="2" />

    <!-- Post 2 (Right shelf, distant) -->
    <line x1="1020" y1="530" x2="1020" y2="380" stroke-width="4" />
    <line x1="1020" y1="380" x2="960" y2="380" stroke-width="4" />
    <line x1="970" y1="380" x2="970" y2="415" stroke="#1e293b" stroke-width="2" />
    <rect x="960" y="415" width="22" height="38" rx="3" fill="none" stroke="#070c18" stroke-width="2" />
  </g>

  <!-- The Hero & Vargas Silhouette on Mountain Pass Path -->
  <!-- Pale Aura around the Hero -->
  <circle cx="560" cy="560" r="140" fill="url(#pale_aura)" />

  <!-- Vargas (Tower Shieldbearer Silhouette) -->
  <path d="M 440 680 L 450 560 Q 470 540, 490 560 L 500 680 Z" fill="#020408" />
  <!-- Vargas Tower Shield -->
  <path d="M 430 530 L 465 520 L 465 670 L 430 655 Z" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
  <!-- Vargas Spirit Flame Wisp -->
  <circle cx="455" cy="505" r="4" fill="#7dd3fc" />

  <!-- The Hero Silhouette -->
  <!-- Tattered Cloak & Plate -->
  <path d="M 540 680 L 545 530 Q 565 500, 585 530 L 590 680 Z" fill="#020408" />
  <!-- Tattered Cape Flutter -->
  <path d="M 540 540 Q 510 570, 500 640 Q 525 610, 545 590 Z" fill="#070c18" />
  <!-- Hero Hood & Grim Profile -->
  <circle cx="565" cy="495" r="14" fill="#020408" />
  <!-- Glowing Eye / Pale Flame on Hands -->
  <circle cx="568" cy="493" r="2.5" fill="#38bdf8" />
  <!-- Pale Sword in Right Hand -->
  <line x1="585" y1="560" x2="640" y2="640" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="640" cy="640" r="8" fill="#38bdf8" opacity="0.6" />

  <!-- Cold Frost Wind Streaks -->
  <path d="M 200 460 Q 500 430, 800 450 T 1200 420" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.3" stroke-dasharray="30,50" />
  <path d="M 100 520 Q 400 490, 750 510 T 1150 490" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" stroke-dasharray="25,40" />
</svg>
