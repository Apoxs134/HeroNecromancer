<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="hall_ambience" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050308" />
      <stop offset="45%" stop-color="#0f0d16" />
      <stop offset="85%" stop-color="#240c14" />
      <stop offset="100%" stop-color="#3b0814" />
    </linearGradient>
    <linearGradient id="marble_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <radialGradient id="alden_cower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero_ice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Banquet Hall Background & High Gothic Arches -->
  <rect width="1280" height="720" fill="url(#hall_ambience)" />

  <!-- Marble Columns Lining the Banquet Hall -->
  <g fill="#111520" stroke="#04060a" stroke-width="2">
    <rect x="80" y="0" width="70" height="520" />
    <polygon points="70,120 115,40 160,120" />
    <rect x="260" y="0" width="70" height="520" />
    <polygon points="250,120 295,40 340,120" />
    <rect x="950" y="0" width="70" height="520" />
    <polygon points="940,120 985,40 1030,120" />
    <rect x="1130" y="0" width="70" height="520" />
    <polygon points="1120,120 1165,40 1210,120" />
  </g>

  <!-- Broken Gothic Stained Glass Window at Center Back -->
  <path d="M 520 40 Q 640 -20, 760 40 L 760 260 Q 640 300, 520 260 Z" fill="#1e1b4b" stroke="#0f172a" stroke-width="4" opacity="0.8" />
  <!-- Crimson Moon Light Filtering Through Window -->
  <ellipse cx="640" cy="150" rx="90" ry="100" fill="#991b1b" opacity="0.3" />

  <!-- High Throne Dais at Far Center -->
  <rect x="520" y="260" width="240" height="120" fill="#090d16" stroke="#fbbf24" stroke-width="2" />
  <!-- Gilded Royal Throne (Empty / Looming) -->
  <path d="M 580 260 L 590 140 Q 640 110, 690 140 L 700 260 Z" fill="#04060a" stroke="#fbbf24" stroke-width="3" />
  <polygon points="630,130 640,110 650,130" fill="#fbbf24" />

  <!-- Marble Polished Floor -->
  <polygon points="0,480 1280,480 1280,720 0,720" fill="url(#marble_floor)" />

  <!-- Overturned Feasting Table & Spilled Poison Wine (Prologue Echo) -->
  <g transform="translate(640, 510)">
    <!-- Overturned Long Table -->
    <polygon points="-280,40 280,20 260,80 -300,90" fill="#1c1917" stroke="#0c0a09" stroke-width="2" />
    <!-- Spilled Wine Puddle (Looks like Blood) -->
    <ellipse cx="60" cy="80" rx="140" ry="30" fill="#881337" opacity="0.85" />
    <ellipse cx="-120" cy="95" rx="70" ry="20" fill="#881337" opacity="0.8" />
    <!-- Broken Golden Goblets -->
    <polygon points="30,70 50,60 45,75" fill="#fbbf24" />
    <polygon points="-80,85 -60,75 -65,90" fill="#fbbf24" />
  </g>

  <!-- King Alden (Right - Cowering in Terror Beside Throne Steps) -->
  <g transform="translate(860, 420)">
    <circle cx="0" cy="20" r="80" fill="url(#alden_cower)" />
    <!-- Royal Ermine Robe Collapsed on Steps -->
    <path d="M -50 140 Q 0 40, 50 140 Z" fill="#7f1d1d" stroke="#fbbf24" stroke-width="1.5" />
    <ellipse cx="0" cy="45" rx="26" ry="12" fill="#f8fafc" /> <!-- Ermine Fur Collar -->
    <!-- King's Cowering Head & Crown -->
    <circle cx="-10" cy="25" r="16" fill="#090d16" />
    <polygon points="-22,12 -12,2 -2,12" fill="#fbbf24" /> <!-- Crooked Crown -->
    <!-- Trembling Hands Raised Pleading -->
    <line x1="-30" y1="35" x2="-60" y2="10" stroke="#fecdd3" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="40" x2="-55" y2="25" stroke="#fecdd3" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- The Hero (Left - Standing Tall, Silent, Cloaked in Cold Death) -->
  <g transform="translate(360, 360)">
    <circle cx="0" cy="120" r="140" fill="url(#hero_ice)" />
    <!-- Heavy Dark Plate & Flared Cape -->
    <path d="M -40 240 L -25 50 Q 0 20, 25 50 L 40 240 Z" fill="#020408" />
    <circle cx="0" cy="25" r="18" fill="#020408" />
    <!-- Cold Soul Eye Flare -->
    <circle cx="6" cy="22" r="3.5" fill="#38bdf8" />
    <!-- Pale Greatsword Resting Point Down on Marble Floor -->
    <line x1="25" y1="70" x2="40" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="40" cy="250" r="8" fill="#7dd3fc" opacity="0.8" />
  </g>
</svg>
