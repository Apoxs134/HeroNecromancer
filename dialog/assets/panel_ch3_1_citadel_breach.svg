<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky_citadel_breach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020307" />
      <stop offset="35%" stop-color="#0c1222" />
      <stop offset="70%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="marble_wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="pale_legion_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="breach_fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky & Burning Crimson Atmospheric Horizon -->
  <rect width="1280" height="720" fill="url(#sky_citadel_breach)" />

  <!-- High Citadel Grand Spires in Silhouette -->
  <polygon points="120,420 180,180 240,420" fill="#050811" />
  <polygon points="560,380 640,120 720,380" fill="#050811" />
  <polygon points="1040,420 1100,160 1160,420" fill="#050811" />

  <!-- The Massive White Marble Outer Walls (Shattered / Breached) -->
  <polygon points="0,260 480,240 460,540 0,580" fill="url(#marble_wall)" />
  <polygon points="800,240 1280,260 1280,580 820,540" fill="url(#marble_wall)" />

  <!-- Shattered Golden Iron Gates (Blown Inward) -->
  <polygon points="440,320 540,560 460,570 410,340" fill="#020408" stroke="#fbbf24" stroke-width="2" />
  <polygon points="840,320 740,560 820,570 870,340" fill="#020408" stroke="#fbbf24" stroke-width="2" />

  <!-- Burning Breach Rubble & Fallen Royal Banners -->
  <circle cx="500" cy="520" r="70" fill="url(#breach_fire)" />
  <circle cx="780" cy="520" r="70" fill="url(#breach_fire)" />

  <!-- Gilded Royal Banners Trampled in Dirt -->
  <polygon points="460,530 520,510 560,550 490,560" fill="#991b1b" stroke="#fbbf24" stroke-width="1.5" />
  <polygon points="760,520 820,500 800,560 740,545" fill="#991b1b" stroke="#fbbf24" stroke-width="1.5" />

  <!-- Breached Archway -->
  <path d="M 460 560 L 480 300 Q 640 220, 800 300 L 820 560 Z" fill="#050811" />

  <!-- The Necromantic Host Gathering in the Breach -->
  <circle cx="640" cy="520" r="220" fill="url(#pale_legion_glow)" />

  <!-- The Hero at Center of the Breach -->
  <g transform="translate(640, 430)">
    <!-- Broad Tattered Cloak -->
    <path d="M -35 150 L -20 30 Q 0 10, 20 30 L 35 150 Z" fill="#020408" />
    <circle cx="0" cy="18" r="14" fill="#020408" />
    <!-- Blazing Cold Flame Eyes -->
    <circle cx="-4" cy="16" r="3" fill="#38bdf8" />
    <circle cx="4" cy="16" r="3" fill="#38bdf8" />
    <!-- Raised Pale Greatsword -->
    <line x1="18" y1="40" x2="60" y2="-40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="60" cy="-40" r="10" fill="#7dd3fc" opacity="0.8" />
  </g>

  <!-- Undead Vanguard & Legion Silhouettes Standing Ranks -->
  <!-- Vargas Shield (Left) -->
  <g transform="translate(530, 480)">
    <path d="M -30 110 L -25 30 Q -10 18, 5 30 L 10 110 Z" fill="#020408" />
    <polygon points="-35,30 5,20 0,110 -40,105" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Risen Inquisitor Halberdier (Right) -->
  <g transform="translate(750, 480)">
    <path d="M -15 110 L -8 28 Q 0 15, 8 28 L 15 110 Z" fill="#020408" />
    <line x1="12" y1="-50" x2="12" y2="110" stroke="#0f172a" stroke-width="3" />
    <polygon points="12,-40 32,-25 12,-10" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Endless Row of Spears Rising from Behind Hero -->
  <g stroke="#030712" stroke-width="2.5" opacity="0.9">
    <line x1="580" y1="480" x2="570" y2="340" />
    <line x1="600" y1="470" x2="595" y2="330" />
    <line x1="680" y1="470" x2="685" y2="330" />
    <line x1="700" y1="480" x2="710" y2="340" />
  </g>

  <!-- Foreground Cobblestone Avenue -->
  <polygon points="0,620 1280,610 1280,720 0,720" fill="#03050a" />
</svg>
