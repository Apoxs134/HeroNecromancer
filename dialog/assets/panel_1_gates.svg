<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky_triumph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gate_gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="1280" height="720" fill="url(#sky_triumph)" />

  <!-- High Citadel Fortress Silhouettes -->
  <rect x="280" y="140" width="140" height="380" fill="#1e1b4b" />
  <polygon points="260,140 350,60 440,140" fill="#1e1b4b" />
  <rect x="860" y="140" width="140" height="380" fill="#1e1b4b" />
  <polygon points="840,140 930,60 1020,140" fill="#1e1b4b" />

  <!-- Massive Outer Walls & Golden Arch -->
  <rect x="0" y="360" width="1280" height="360" fill="#0f172a" />
  <path d="M 420 520 C 420 280, 860 280, 860 520 Z" fill="url(#gate_gold)" opacity="0.85" />
  <path d="M 470 520 C 470 340, 810 340, 810 520 Z" fill="#020617" />

  <!-- Victory Banners -->
  <polygon points="320,200 320,380 350,350 380,380 380,200" fill="#b91c1c" />
  <polygon points="900,200 900,380 930,350 960,380 960,200" fill="#b91c1c" />

  <!-- Hero & Sworn Vanguard Silhouettes (Arriving Triumphant) -->
  <path d="M 640 430 L 610 520 L 670 520 Z" fill="#fbbf24" /> <!-- The Hero (Golden Light Aura) -->
  <circle cx="640" cy="415" r="18" fill="#fbbf24" />
  <line x1="660" y1="390" x2="660" y2="520" stroke="#fef08a" stroke-width="4" /> <!-- Holy Blade -->

  <!-- Companions (Vargas, Kaelen, Lyra) -->
  <rect x="540" y="440" width="45" height="80" rx="6" fill="#64748b" /> <!-- Vargas & Shield -->
  <polygon points="530,440 545,440 545,520 530,510" fill="#94a3b8" />
  <polygon points="720,445 745,520 705,520" fill="#475569" /> <!-- Kaelen (Archer) -->
  <polygon points="780,455 800,520 765,520" fill="#cbd5e1" /> <!-- Lyra (Cleric) -->

</svg>
