<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="poison_mist" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05050a" />
    </radialGradient>
    <linearGradient id="blood_poison" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Dark Chamber & Hemlock Vapors -->
  <rect width="1280" height="720" fill="url(#poison_mist)" />

  <!-- Poison Haze Swirls -->
  <ellipse cx="640" cy="460" rx="420" ry="140" fill="url(#blood_poison)" opacity="0.6" filter="blur(20px)" />

  <!-- Overturned Banquet Table & Shattered Chalice -->
  <polygon points="280,480 880,510 820,560 220,530" fill="#1c1917" />
  <!-- Spilled Golden Goblet & Black Hemlock Pool -->
  <circle cx="440" cy="560" r="14" fill="#ca8a04" />
  <ellipse cx="500" cy="580" rx="90" ry="25" fill="#09090b" opacity="0.9" />
  <ellipse cx="520" cy="580" rx="60" ry="15" fill="#14532d" opacity="0.7" />

  <!-- Royal Halberdiers (Ambushing Shadows) -->
  <!-- Halberd 1 -->
  <line x1="160" y1="180" x2="380" y2="480" stroke="#94a3b8" stroke-width="6" />
  <polygon points="360,460 410,500 370,510" fill="#cbd5e1" />
  <!-- Halberd 2 -->
  <line x1="1100" y1="180" x2="840" y2="470" stroke="#94a3b8" stroke-width="6" />
  <polygon points="860,450 810,490 850,500" fill="#cbd5e1" />
  <!-- Halberd 3 (Center Strike) -->
  <line x1="720" y1="120" x2="620" y2="450" stroke="#e2e8f0" stroke-width="7" />
  <polygon points="630,430 590,480 635,485" fill="#f8fafc" />

  <!-- Collapsed Vanguard & Poisoned Hero -->
  <!-- Vargas fallen with cracked shield -->
  <rect x="760" y="490" width="120" height="40" rx="8" transform="rotate(-15 760 490)" fill="#334155" opacity="0.8" />
  <!-- Hero Clutches Throat in Agony -->
  <circle cx="580" cy="460" r="24" fill="#64748b" />
  <ellipse cx="560" cy="520" rx="55" ry="30" fill="#1e293b" />
  <line x1="570" y1="465" x2="550" y2="450" stroke="#f1f5f9" stroke-width="4" /> <!-- Hand to throat -->

  <!-- Scene Caption Tag -->
  <rect x="40" y="40" width="340" height="38" rx="6" fill="#000000" opacity="0.65" />
  <text x="55" y="65" fill="#ef4444" font-family="sans-serif" font-size="16" font-weight="bold">ACT 0 — 3. THE TREACHERY</text>
</svg>
